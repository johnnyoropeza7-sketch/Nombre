<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f6f7fb;color:#222}
header{background:linear-gradient(135deg,#2b1a6e,#6a3de8);color:#fff;padding:20px 12px 16px;text-align:center}
header svg{width:84px;height:84px;display:block;margin:0 auto 6px}
header .t{font-size:22px;font-weight:700;letter-spacing:.5px}
header .s{font-size:13px;opacity:.8;margin-top:2px}
main{max-width:480px;margin:24px auto;padding:0 16px}
input{width:100%;box-sizing:border-box;padding:14px;font-size:18px;border:1px solid #ccc;border-radius:10px}
#b{width:100%;margin-top:12px;padding:14px;font-size:18px;border:0;border-radius:10px;background:#4a4ae0;color:#fff}
#res{margin-top:20px;padding:16px;background:#fff;border-radius:10px;display:none;line-height:1.5}
#res h2{margin:0 0 6px}
#a{position:fixed;bottom:12px;right:12px;opacity:.15;font-size:12px;padding:6px 10px;border:0;border-radius:8px}
#p{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:9}
#p div.c{background:#fff;border-radius:14px;padding:20px;width:290px;text-align:center}
#p h3{margin:0 0 14px}
#p .r{display:flex;align-items:center;justify-content:center;gap:18px;margin:10px 0 16px}
#p .r button{width:44px;height:44px;font-size:24px;border:0;border-radius:50%;background:#4a4ae0;color:#fff}
#p .r span{font-size:28px;min-width:30px}
#p label{display:block;margin:8px 0 16px;font-size:16px}
#p .x{width:100%;padding:12px;border:0;border-radius:10px;background:#4a4ae0;color:#fff;font-size:16px;margin-top:6px}
body.notas{background:#fffbe6}
body.notas header,body.notas main{display:none}
#nt{display:none}
body.notas #nt{display:block}
#nt .nh{background:#f5c518;padding:14px;text-align:center;font-weight:600;font-size:18px;color:#222}
#nta{width:100%;box-sizing:border-box;height:70vh;border:0;background:transparent;padding:16px;font-size:20px;line-height:1.5;outline:none;resize:none;color:#222}

const OR = ["latín","griego","hebreo","quechua","náhuatl","guaraní","germánico","árabe","celta","maya"];
const SG = ["El que ilumina el camino","Portador de buena fortuna","Corazón valiente","Guardián de los sueños","Espíritu libre","El que trae alegría","Mente brillante","El que une a su gente","Voz de la verdad","El que florece en tiempos difíciles","Protector de su familia","Estrella que guía","Fuerza serena","Portador de esperanza"];
const norm = s => s.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function hash(s){let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h;}
function datos(raw){
  const k = norm(raw);
  if(L[k]) return {full:L[k]+".", key:L[k].replace(/\s*\(.*?\)/g,"")};
  const h = hash(k), f = SG[(h>>3)%SG.length];
  return {full:"Del "+OR[h%OR.length]+": «"+f+"». Nombre poco común, asociado a personas de carácter fuerte y sensible.", key:f};
}
let C = {rep:3, sig:true, mode:"b"};
try{ C = Object.assign(C, JSON.parse(localStorage.getItem("cfg")||"{}")); }catch(e){}
function guardar(){ try{ localStorage.setItem("cfg", JSON.stringify(C)); }catch(e){} }
let VOZ=null;
function elegirVoz(){ try{ const v=speechSynthesis.getVoices()||[]; VOZ=v.find(x=>/^es[-_]MX/i.test(x.lang))||v.find(x=>/^es/i.test(x.lang))||null; }catch(e){} }
try{ elegirVoz(); speechSynthesis.addEventListener("voiceschanged",elegirVoz); }catch(e){}
function estado(t){ const e=document.getElementById("st"); if(e) e.textContent="Audio: "+t; }
function decirN(txt){
  try{ speechSynthesis.cancel(); speechSynthesis.resume(); }catch(e){}
  setTimeout(()=>{
    for(let i=0;i<C.rep;i++){
      const u=new SpeechSynthesisUtterance(txt);
      u.lang=VOZ?VOZ.lang:"es-ES"; if(VOZ) u.voice=VOZ;
      u.rate=0.9; u.volume=1;
      u.onstart=()=>estado("sonando");
      u.onerror=e=>estado("error ("+((e&&e.error)||"?")+")");
      speechSynthesis.speak(u);
    }
  },120);
}
function hablar(n,key){ decirN(C.sig ? n+". "+key : n); }
let desb=false;
function desbloquear(){
  if(desb) return; desb=true;
  try{ const u=new SpeechSynthesisUtterance("a"); u.volume=0; u.lang="es-ES"; speechSynthesis.speak(u); }catch(e){}
  try{ navigator.wakeLock && navigator.wakeLock.request("screen").catch(()=>{}); }catch(e){}
}
["touchend","click","keydown"].forEach(ev=>document.addEventListener(ev,desbloquear));
function decir(x){
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(x);
  u.lang = "es-ES"; u.rate = 0.9;
  speechSynthesis.speak(u);
}
document.getElementById("a").onclick = () => {
  speechSynthesis.speak(new SpeechSynthesisUtterance(" "));
  navigator.wakeLock && navigator.wakeLock.request("screen").catch(()=>{});
};
function buscar(){
  const raw = document.getElementById("n").value.trim();
  if(!raw) return;
  const d = datos(raw);
  hablar(raw.trim(), d.key);
  const nombre = raw.charAt(0).toUpperCase()+raw.slice(1).toLowerCase();
  const r = document.getElementById("res");
  r.innerHTML = "<h2>"+nombre.replace(/</g,"&lt;")+"</h2><div>"+d.full+"</div>";
  r.style.display = "block";
}
document.getElementById("b").onclick = buscar;
document.getElementById("n").addEventListener("keydown",e=>{if(e.key==="Enter")buscar();});

const P=document.getElementById("p"), V=document.getElementById("v"), S=document.getElementById("s");
function abrir(){ V.textContent=C.rep; S.checked=C.sig; P.style.display="flex"; }
document.getElementById("m").onclick=()=>{ if(C.rep>1){C.rep--;V.textContent=C.rep;guardar();} };
document.getElementById("M").onclick=()=>{ if(C.rep<9){C.rep++;V.textContent=C.rep;guardar();} };
S.onchange=()=>{ C.sig=S.checked; guardar(); };
document.getElementById("t").onclick=()=>hablar("Camila","Ayudante del templo");
document.getElementById("c").onclick=()=>{ P.style.display="none"; };
// Abrir: tocar con TRES DEDOS la pantalla (o tocar 5 veces el logo)
document.addEventListener("touchstart",e=>{ if(e.touches.length===3){ e.preventDefault(); abrir(); } },{passive:false});
let tq=0,tt;
document.querySelector("header svg").addEventListener("click",()=>{ tq++; clearTimeout(tt); tt=setTimeout(()=>tq=0,1500); if(tq>=5){tq=0;abrir();} });

const MD=document.getElementById("md"), NTA=document.getElementById("nta");
function aplicarModo(){ document.body.classList.toggle("notas", C.mode==="n"); MD.value=C.mode; }
MD.onchange=()=>{ C.mode=MD.value; guardar(); aplicarModo(); };
aplicarModo();
const _abrir=abrir; abrir=function(){ _abrir(); MD.value=C.mode; };
function repetir(txt){ decirN(txt); }
let nTimer, nUlt="";
NTA.addEventListener("input",()=>{
  clearTimeout(nTimer);
  nTimer=setTimeout(()=>{
    const t=NTA.value.trim();
    if(t && t!==nUlt){ nUlt=t; repetir(t); }
  },2000);
});
let nq=0,nt2;
document.getElementById("nh").addEventListener("click",()=>{ nq++; clearTimeout(nt2); nt2=setTimeout(()=>nq=0,1500); if(nq>=5){nq=0;abrir();} });
