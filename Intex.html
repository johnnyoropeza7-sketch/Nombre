const OR = ["latín","griego","hebreo","quechua","náhuatl","guaraní","germánico","árabe","celta","maya"];
const SG = ["El que ilumina el camino","Portador de buena fortuna","Corazón valiente","Guardián de los sueños","Espíritu libre","El que trae alegría","Mente brillante","El que une a su gente","Voz de la verdad","El que florece en tiempos difíciles","Protector de su familia","Estrella que guía","Fuerza serena","Portador de esperanza"];
const norm = s => s.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function hash(s){let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h;}
function significado(raw){
  const k = norm(raw);
  if(L[k]) return L[k]+".";
  const h = hash(k);
  return "Del "+OR[h%OR.length]+": «"+SG[(h>>3)%SG.length]+"». Nombre poco común, asociado a personas de carácter fuerte y sensible.";
}
function decir(x){
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(x);
  u.lang = "es-ES"; u.rate = 0.9;
  speechSynthesis.speak(u);
}
document.getElementById("a").onclick = () => {
  speechSynthesis.speak(new SpeechSynthesisUtterance(" "));
  navigator.wakeLock && navigator.wakeLock.request("screen").catch(()=>{});
};
function buscar(){
  const raw = document.getElementById("n").value.trim();
  if(!raw) return;
  decir(raw);
  const nombre = raw.charAt(0).toUpperCase()+raw.slice(1).toLowerCase();
  const r = document.getElementById("res");
  r.innerHTML = "<h2>"+nombre.replace(/</g,"&lt;")+"</h2><div>"+significado(raw)+"</div>";
  r.style.display = "block";
}
document.getElementById("b").onclick = buscar;
document.getElementById("n").addEventListener("keydown",e=>{if(e.key==="Enter")buscar();});
